<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PhotoFrame AI | MG Shankar Tech</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 15px;
            font-family: Arial, sans-serif;
            background: #0b1020;
            color: #ffffff;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        header {
            text-align: center;
            padding: 20px 10px;
        }

        header h1 {
            color: #45d9ff;
            font-size: 32px;
            margin-bottom: 8px;
        }

        header p {
            color: #aebbd0;
        }

        .card {
            background: #182238;
            border: 1px solid #293956;
            padding: 20px;
            border-radius: 16px;
            margin: 18px 0;
        }

        h2, h3 {
            margin-top: 0;
        }

        input[type="file"],
        select {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            background: #263650;
            color: white;
            border: 1px solid #405574;
            border-radius: 9px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 12px;
            border: none;
            border-radius: 9px;
            background: #00a9e8;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #008bc2;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .secondary {
            background: #334764;
        }

        #status {
            text-align: center;
            color: #63e6ff;
            margin-top: 15px;
            overflow-wrap: anywhere;
        }

        #gallery {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin-top: 20px;
        }

        .frame {
            background: #25334b;
            padding: 9px;
            border-radius: 12px;
            overflow: hidden;
        }

        .frame img {
            width: 100%;
            display: block;
            border-radius: 8px;
            aspect-ratio: 16 / 10;
            object-fit: contain;
            background: #080d18;
        }

        .frame label {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 10px 2px 2px;
            font-size: 13px;
        }

        .frame input[type="checkbox"] {
            width: 18px;
            height: 18px;
        }

        .empty {
            color: #9baac0;
            text-align: center;
            padding: 25px 5px;
            grid-column: 1 / -1;
        }

        footer {
            text-align: center;
            color: #8493a9;
            padding: 20px 5px;
            font-size: 13px;
        }

        @media (min-width: 650px) {
            #gallery {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>📸 PhotoFrame AI</h1>
        <p>Extract memorable photo frames from your videos.</p>
        <p>Developed by MG Shankar Tech</p>
    </header>

    <section class="card">

        <h2>🎬 Upload Your Video</h2>

        <input
            type="file"
            id="video"
            accept="video/*"
        >

        <h3>Frame Extraction Interval</h3>

        <select id="interval">
            <option value="1">Every 1 Second</option>
            <option value="0.5">Every 0.5 Second</option>
            <option value="0.25">Every 0.25 Second</option>
            <option value="2">Every 2 Seconds</option>
            <option value="5">Every 5 Seconds</option>
        </select>

        <button id="extract" onclick="extractFrames()">
            Extract Video Frames
        </button>

        <div id="status">
            Select a video to get started.
        </div>

    </section>

    <section class="card">

        <h2>🖼️ Extracted Frames</h2>

        <button class="secondary" onclick="selectAll()">
            Select All Frames
        </button>

        <button class="secondary" onclick="deselectAll()">
            Deselect All
        </button>

        <div id="gallery">
            <div class="empty">
                Your extracted photos will appear here.
            </div>
        </div>

        <button id="download" onclick="downloadSelected()">
            Download Selected Photos
        </button>

    </section>

    <footer>
        PhotoFrame AI | MG Shankar Tech
    </footer>

</div>

<script>

let frames = [];
let currentJobId = "";

async function extractFrames() {

    const fileInput = document.getElementById("video");
    const file = fileInput.files[0];

    const button = document.getElementById("extract");
    const status = document.getElementById("status");
    const gallery = document.getElementById("gallery");

    if (!file) {
        alert("Please select a video first.");
        return;
    }

    if (!file.type.startsWith("video/")) {
        alert("Please select a valid video file.");
        return;
    }

    button.disabled = true;
    status.innerText = "Uploading video and extracting frames...";

    gallery.innerHTML = "";
    frames = [];
    currentJobId = "";

    const formData = new FormData();

    formData.append("video", file);

    formData.append(
        "interval",
        document.getElementById("interval").value
    );

    try {

        const response = await fetch("/api/extract", {
            method: "POST",
            body: formData
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Frame extraction failed.");
        }

        currentJobId = data.job_id;
        frames = data.frames || [];

        if (!currentJobId || frames.length === 0) {
            throw new Error("No frames were returned by the server.");
        }

        gallery.innerHTML = "";

        frames.forEach((frame, index) => {

            const div = document.createElement("div");
            div.className = "frame";

            const img = document.createElement("img");

            img.src = frame.url;
            img.alt = "PhotoFrame " + (index + 1);
            img.loading = "lazy";

            const label = document.createElement("label");

            const checkbox = document.createElement("input");

            checkbox.type = "checkbox";
            checkbox.className = "frame-check";
            checkbox.value = frame.name;
            checkbox.checked = true;

            label.appendChild(checkbox);

            const time = frame.time !== undefined
                ? frame.time + " sec"
                : "";

            label.append(
                " Frame " + (index + 1) + " " + time
            );

            div.appendChild(img);
            div.appendChild(label);

            gallery.appendChild(div);

        });

        status.innerText =
            "✅ Successfully extracted " +
            frames.length +
            " frames.";

    } catch (error) {

        status.innerText = "❌ " + error.message;

        gallery.innerHTML =
            '<div class="empty">Could not extract frames.</div>';

    } finally {

        button.disabled = false;

    }

}


function selectAll() {

    document.querySelectorAll(".frame-check").forEach(box => {
        box.checked = true;
    });

}


function deselectAll() {

    document.querySelectorAll(".frame-check").forEach(box => {
        box.checked = false;
    });

}


async function downloadSelected() {

    const status = document.getElementById("status");

    const selected = Array.from(
        document.querySelectorAll(".frame-check:checked")
    ).map(box => box.value);

    if (!currentJobId) {
        alert("Please extract frames first.");
        return;
    }

    if (selected.length === 0) {
        alert("Please select at least one frame.");
        return;
    }

    status.innerText = "Preparing your selected photos...";

    try {

        const response = await fetch("/api/download", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                job_id: currentJobId,
                frames: selected
            })

        });

        if (!response.ok) {

            let message = "Download failed.";

            try {
                const error = await response.json();
                message = error.error || message;
            } catch (_) {}

            throw new Error(message);

        }

        const blob = await response.blob();

        const url = URL.createObjectURL(blob);

        const link = document.createElement("a");

        link.href = url;
        link.download = "PhotoFrame_Selected.zip";

        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(() => {
            URL.revokeObjectURL(url);
        }, 2000);

        status.innerText = "✅ Your ZIP download has started.";

    } catch (error) {

        status.innerText = "❌ " + error.message;

    }

}

</script>

</body>
    </html>
